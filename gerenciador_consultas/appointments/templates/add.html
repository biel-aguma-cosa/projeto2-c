{% extends 'base.html' %}

{% block title %}
    Registrar Consulta
{% endblock title %}


{% block content %}
    <div class="container mt-1 d-flex align-items-center flex-column">
        <span class="mb-3"><h3>Registrar Consulta</h3></span>
        <div class="card d-flex p-1 ps-3 pe-3">
            <div class="card-body">
                <form action="{% url 'appointments:edit' id=appointment.id %}" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">
                        Confirmar
                    </button>
                    <a href="{% url 'appointments:list' %}" class="btn btn-danger">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
{% endblock content %}
