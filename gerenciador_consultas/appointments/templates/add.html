{% extends 'base.html' %}

{% block title %}
    Registrar Consulta
{% endblock title %}


{% block content %}
    <div class="mb-4"><div class="eyebrow mb-2">Agenda</div><h1 class="page-title mb-1">Registrar consulta</h1><p class="text-secondary">Cadastre um novo atendimento.</p></div>
        <div class="panel p-4 p-md-5">
                <form action="{% url 'appointments:edit' id=appointment.id %}" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Confirmar</button>
                    <a href="{% url 'appointments:list' %}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
        </div>
    </div>
{% endblock content %}
